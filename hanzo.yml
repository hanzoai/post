# Hanzo CI/CD — post. All real config is here; .hanzo/workflows/cicd.yml is
# triggers and an import of hanzoai/ci.

test:
  # Frozen, so the gate resolves the same tree the Dockerfile does. The lockfile
  # ships, and a stale one fails here rather than silently building something
  # else.
  - name: install
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile

  - name: postiz
    run: node --test scripts/base.test.mjs server/postiz.test.mjs server/http.test.mjs server/edge.test.mjs server/catalog.test.mjs server/audience.test.mjs server/credentials.test.mjs server/agent.test.mjs

  # Verbatim the build line the image runs, run before there is an image, so a
  # break arrives in a minute instead of after a full layer stack. `pnpm build`
  # is `tsc --noEmit && hanzo serve build`, so install the hanzo CLI via
  # hanzo.sh when the bare runner does not carry it, matching Dockerfile.
  - name: build
    run: |
      set -e
      export PATH="$HOME/.local/bin:$PATH"
      command -v hanzo >/dev/null 2>&1 || (curl -fsSL https://hanzo.sh | sh -s -- hanzo)
      pnpm build
      test -s dist/index.html
      test -d dist/post/assets
      grep -q '/post/assets/' dist/index.html

images:
  - name: post
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/post
    # No build_secrets, and none belong here. Every credential that names a
    # person is minted by hanzo.id at sign-in; every credential that names a
    # network is sealed in KMS and read only by the publisher, server-side.

# Two doors. The native API is /v1/social on api.hanzo.ai (MCP tool `social`,
# CLI `hanzo social`). The app is hanzo.app/post. social.hanzo.ai is the Postiz drop-in for a client that
# already speaks Postiz: /mcp, /api/mcp, /public/v1, /api/public/v1. The worker
# hanzo-social-postiz serves those paths and POST /v1/social/mcp, the native
# agent tool. The image above serves both when it owns the process: Postiz
# paths locally, and /v1 proxied to HANZO_API
# (default https://api.hanzo.ai). The frontend calls api.hanzo.ai.
#
# The site lane publishes dist under the slug `post`. hanzo.app/post serves
# that prefix (universe infra/sites/sites.yaml, route post-hanzo-app), so a main
# publish is a deploy. social.hanzo.ai only redirects there; the Postiz worker
# route stays in front of it and keeps answering JSON.
#
# `build` runs ON THE PUBLISH JOB. The test gate also produces dist, but that
# is a different runner: the site step looks at THIS checkout, and without a
# build here it reports "dist is not a directory" after a green test. Same
# commands as the image, so the bytes the edge serves are the bytes the gate
# already compiled.
site:
  slug: post
  dir: dist
  on: [main]
  build: |
    set -e
    export PATH="$HOME/.local/bin:$PATH"
    command -v hanzo >/dev/null 2>&1 || (curl -fsSL https://hanzo.sh | sh -s -- hanzo)
    corepack enable
    pnpm install --frozen-lockfile
    pnpm build
    test -s dist/index.html
    test -d dist/post/assets
    grep -q '/post/assets/' dist/index.html
